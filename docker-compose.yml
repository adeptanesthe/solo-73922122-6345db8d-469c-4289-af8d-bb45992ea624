services:
  abx-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: abx-studio:latest
    container_name: abx-studio
    ports:
      # Host port can be overridden: ABX_PORT=8080 docker compose up
      - "${ABX_PORT:-5000}:5000"
    environment:
      ABX_DATA_DIR: /data
    volumes:
      - abx-data:/data
    restart: unless-stopped

volumes:
  abx-data:
