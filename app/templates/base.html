<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ABX 盲听校准台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M7 16h3l2-6 4 12 2-6h7' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="7" fill="#4f46e5"/><path d="M7 16h3l2-6 4 12 2-6h7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>ABX 盲听校准台</span>
    </a>
    <nav class="mainnav">
      <a href="/">上传 A/B</a>
      <a href="/questions">题目记录</a>
    </nav>
  </div>
</header>

<main class="wrap content">
  {% block content %}{% endblock %}
</main>

<footer class="footer wrap">
  <span>Flask · NumPy · 16 kHz mono PCM16 · 单增益电平校准 · 同位置 ABX 切换</span>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
